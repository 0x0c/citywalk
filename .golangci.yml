version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    rules:
      # Generated code carries none of the repository's own style guarantees.
      - path: 'gen/.*\.go'
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - gen/.*
